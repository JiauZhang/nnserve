[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nnserve"
dynamic = ["version"]
description = "Inference serving for neural network models"
authors = [
    {name = "Jiau Zhang", email = "jiauzhang@163.com"},
]
requires-python = ">=3.10"
dependencies = [
    "nnm",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.11",
    "python-multipart>=0.0.20",
    "tokenizers>=0.22",
]

[project.optional-dependencies]
pdf = [
    "pypdfium2>=4.30",
]
kitten = [
    "misaki>=0.9.4",
    "spacy>=3.8",
    "num2words",
    "espeakng_loader",
    "phonemizer",
]
ja = [
    "fugashi",
    "unidic-lite",
    "pyopenjtalk",
    "jaconv",
    "mojimoji",
]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.17.0",
]

[project.scripts]
nnserve = "nnserve.cli:main"

[tool.hatch.version]
path = "nnserve/version.py"

[tool.hatch.build.targets.wheel]
packages = ["nnserve"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"nnserve/tts/kitten_frontend/**" = ["PLC0415"]
